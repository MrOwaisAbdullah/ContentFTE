# Alembic configuration (ENG-15 / OPS-01).
#
#   alembic upgrade head          apply every pending migration to DATABASE_URL
#   alembic current               which revision the database is at
#   alembic revision -m "add x"   write a new revision by hand (see migrations/versions/)
#
# The database URL is NOT stored here - migrations/env.py reads it from the same place the engine does
# (lib.db.database_url(), i.e. DATABASE_URL), so a migration can never run against a different database.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
