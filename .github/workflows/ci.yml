name: CI

# Offline checks on every pull request and on master: the engine's pytest suite, the operator console's
# typecheck + tests, and the SDK's typecheck/build/smoke. Nothing here needs a secret, a network service or
# a deploy - the point is that a change cannot reach master without the suite having run (PIPE-22).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.1"
      - name: Install exactly what uv.lock pins
        run: uv sync --frozen
      - name: Syntax check
        run: uv run python -m compileall -q lib sdk tools blog_agent mcp_server scripts main.py
      - name: Status board is in sync with the plan
        run: uv run python scripts/improvement_status.py --check
      - name: pytest
        env:
          # the suite never calls a real provider; these only satisfy import-time configuration
          OPENROUTER_API_KEY: test
          GEMINI_API_KEY: test
          TAVILY_API_KEY: test
        run: |
          uv run pytest -q -p no:cacheprovider

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - name: typecheck, build, smoke
        run: npm test
      - name: webhook + SEO helper unit tests
        run: node --no-warnings --experimental-strip-types --test sanity/webhooks/auth.test.ts sanity/lib/seo.test.ts
